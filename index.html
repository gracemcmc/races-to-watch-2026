<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Primaries to Watch in 2026 | The Assembly</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="An interactive guide to the 26 most important North Carolina primary elections in 2026, from The Assembly.">
  <meta property="og:title" content="26 NC Primary Races to Watch">
  <meta property="og:description" content="An interactive guide to the 26 most important North Carolina primary elections in 2026.">
  <meta property="og:type" content="website">
</head>
<body>
  <div class="container">

    <nav class="controls">
      <div class="view-modes">
        <span class="control-label">View:</span>
        <button class="view-btn" data-view="skim">Races</button>
        <button class="view-btn active" data-view="peek">Matchups</button>
        <button class="view-btn" data-view="deep-dive">Deep Dive</button>
      </div>

      <div class="type-filters">
        <span class="control-label">Filter:</span>
        <button class="filter-btn active" data-type="ALL">All</button>
        <button class="filter-btn" data-type="U.S. House">US House</button>
        <button class="filter-btn" data-type="U.S. Senate">US Senate</button>
        <button class="filter-btn" data-type="State Senate">NC Senate</button>
        <button class="filter-btn" data-type="State House">NC House</button>
        <button class="filter-btn" data-type="Judicial">Judicial</button>
      </div>
    </nav>

    <main class="board" id="board">
      <!-- Cards populated by JavaScript -->
    </main>

    <footer class="footer">
      <p>Data sourced from <a href="https://www.theassemblync.com/" target="_blank" rel="noopener">The Assembly</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
